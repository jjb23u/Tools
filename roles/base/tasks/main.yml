---
- name: Install base packages
  become: true
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present

- name: Create workspace and toolkit directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ base_directories }}"

- name: Ensure fish config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}/.config/fish"
    - "{{ ansible_env.HOME }}/.config/fish/conf.d"
    - "{{ ansible_env.HOME }}/.config/fish/functions"

- name: Deploy fish config
  ansible.builtin.copy:
    src: config.fish
    dest: "{{ ansible_env.HOME }}/.config/fish/config.fish"
    mode: "0644"

- name: Deploy auto-venv hook
  ansible.builtin.copy:
    src: auto_venv.fish
    dest: "{{ ansible_env.HOME }}/.config/fish/conf.d/auto_venv.fish"
    mode: "0644"

- name: Deploy workspace helper
  ansible.builtin.copy:
    src: work.fish
    dest: "{{ ansible_env.HOME }}/.config/fish/functions/work.fish"
    mode: "0644"

- name: Set fish as the login shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/fish
