---
- name: Install the COSMIC desktop environment
  become: true
  ansible.builtin.dnf:
    name: "{{ desktop_group }}"
    state: present

- name: Install GUI tools
  become: true
  ansible.builtin.dnf:
    name: "{{ desktop_packages }}"
    state: present

- name: Enable the COSMIC greeter
  become: true
  ansible.builtin.systemd:
    name: cosmic-greeter
    enabled: true

- name: Boot to the graphical target
  become: true
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true

- name: Allow the user to capture packets without root
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: wireshark
    append: true
