---
vm_name: tools
vm_user: jbutler
vm_memory: 8192
vm_vcpus: 4
vm_disk_size: 80G

vm_network_name: tools-vm-net
vm_network_bridge: virbr-tools
vm_network_domain: tools
vm_network_address: 192.168.150.1
vm_network_netmask: 255.255.255.0
vm_dhcp_start: 192.168.150.2
vm_dhcp_end: 192.168.150.254
vm_dns_forwarders:
  - 9.9.9.9
  - 1.1.1.1

vm_image_dir: /var/lib/libvirt/images
vm_base_image: "{{ vm_image_dir }}/fedora-43-cloud-base.qcow2"
vm_disk: "{{ vm_image_dir }}/{{ vm_name }}.qcow2"
vm_cloudinit_userdata: "/var/tmp/{{ vm_name }}-cloud-init.yaml"

# Pin the image: copy the qcow2 link and its sha256 from
# https://fedoraproject.org/cloud/download (the URL includes the respin).
vm_base_image_url: "https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-43-1.1.x86_64.qcow2"
vm_base_image_checksum: ""

vm_ssh_pubkey_file: "{{ ansible_env.HOME }}/.ssh/id_ed25519.pub"
