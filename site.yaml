---
- name: Configure the tools lab VM
  hosts: lab
  gather_facts: true
  pre_tasks:
    - name: Check for cloud-init
      ansible.builtin.stat:
        path: /usr/bin/cloud-init
      register: cloud_init_bin
      tags: always

    - name: Wait for cloud-init to finish first boot
      become: true
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_wait
      changed_when: false
      failed_when: cloud_init_wait.rc not in [0, 2]
      when: cloud_init_bin.stat.exists
      tags: always
  roles:
    - { role: base, tags: [base] }
    - { role: go_tools, tags: [go, tools] }
    - { role: python_tools, tags: [python, tools] }
    - { role: wordlists, tags: [wordlists] }
    - { role: desktop, tags: [desktop], when: "with_desktop | default(false) | bool" }
